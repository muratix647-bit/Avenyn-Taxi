<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0798df" />
    <title>Avenyn Taxi – Boka taxi</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; background:linear-gradient(180deg,#f8fcff 0%,#eef6fa 100%); color:#071d31; display:grid; place-items:center; padding:24px; }
      main { width:min(460px,100%); text-align:center; background:#fff; border:1px solid #dbeaf3; border-radius:28px; padding:34px 24px 28px; box-shadow:0 18px 55px rgba(7,29,49,.12); }
      .brand { font-weight:900; letter-spacing:.08em; font-size:30px; }
      .since { margin:8px 0 28px; color:#52697a; font-size:15px; }
      .book { display:block; width:100%; border:0; border-radius:18px; background:#0798df; color:white; text-decoration:none; font-size:20px; font-weight:800; padding:18px 20px; box-shadow:0 10px 24px rgba(7,152,223,.25); }
      .book:active { transform:translateY(1px); }
      .hint { margin:18px 0 0; color:#6c7d89; font-size:13px; line-height:1.45; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">AVENYN TAXI</div>
      <div class="since">Göteborg · sedan 2003</div>
      <a class="book" href="https://avenyntaxi.se/?native=customer#booking">BOKA TAXI</a>
      <p class="hint">Samma bokning och priser som på avenyntaxi.se.</p>
    </main>
  </body>
</html>
