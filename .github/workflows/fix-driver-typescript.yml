name: Trigger fixed Driver iOS build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-driver-typescript.yml'

permissions:
  actions: write

jobs:
  trigger-driver:
    runs-on: ubuntu-latest
    steps:
      - name: Starta Driver iOS-bygge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Trigger 2 - Xcode project fix'
          sleep 3
          gh workflow run driver-ios.yml --repo muratix647-bit/Avenyn-Taxi --ref main
