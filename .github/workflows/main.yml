name: Build Avenyn Taxi Customer iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Hämta rätt kundapp
        uses: actions/checkout@v4
        with:
          ref: ios-app-store

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera paket
        run: npm ci

      - name: Synka kundappen till iOS
        run: |
          set -e
          npx cap sync ios

      - name: Kontrollera att rätt kundapp byggs
        run: |
          set -e
          echo "Kontrollerar Bundle ID och kund-URL..."
          grep -n 'se.avenyntaxi.app' capacitor.config.ts
          grep -n 'native=customer#booking' capacitor.config.ts
          ! grep -R "Avenyn Taxi Dashboard" -n . --exclude-dir=node_modules --exclude-dir=.git
          ! grep -R "NEXT_PUBLIC_SUPABASE_URL" -n . --exclude-dir=node_modules --exclude-dir=.git
          test -f ios/App/App.xcodeproj/project.pbxproj
          echo "Rätt Avenyn Taxi kundapp verifierad."

      - name: Lägg in iOS-inställningar
        run: |
          set -e
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Din plats används för att hitta din upphämtningsadress och visa taxibilar nära dig." "$PLIST"

      - name: Installera Apple-certifikat och provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          CERTIFICATE_PATH="$RUNNER_TEMP/avenyn-taxi-distribution.p12"
          PP_PATH="$RUNNER_TEMP/avenyn-taxi.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$PROVISIONING_PROFILE_BASE64"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          echo "Profil: $PROFILE_NAME / $APP_IDENTIFIER"
          test "$APP_IDENTIFIER" = "YY8P86Q275.se.avenyntaxi.app"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Konfigurera signering och Build 16
        run: |
          set -e
          gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          abort('App-target hittades inte') unless target

          target.build_configurations.each do |config|
            config.build_settings['DEVELOPMENT_TEAM'] = 'YY8P86Q275'
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'Avenyn Taxi App Store'
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'se.avenyntaxi.app'
            config.build_settings['PRODUCT_NAME'] = 'Avenyn Taxi'
            config.build_settings['MARKETING_VERSION'] = '1.0'
            config.build_settings['CURRENT_PROJECT_VERSION'] = '16'
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
            config.build_settings['TARGETED_DEVICE_FAMILY'] = '1'
          end

          project.save
          puts 'Avenyn Taxi kundapp konfigurerad som version 1.0 build 16.'
          RUBY

      - name: Skapa ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>YY8P86Q275</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>se.avenyntaxi.app</key>
              <string>Avenyn Taxi App Store</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Arkivera signerad kundapp
        run: |
          set -e
          mkdir -p build
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../../build/AvenynTaxiCustomer.xcarchive \
            archive

      - name: Exportera signerad IPA
        run: |
          set -e
          mkdir -p build/export
          xcodebuild \
            -exportArchive \
            -archivePath build/AvenynTaxiCustomer.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          find build/export -maxdepth 2 -type f -print
          test -n "$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Ladda upp IPA-artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avenyn-Taxi-Customer-Build-16-IPA
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Förbered App Store Connect API-nyckel
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -e
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          test -s "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Validera och ladda upp Build 16 till App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -e
          IPA_FILE="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_FILE"

          echo "Validerar Build 16..."
          xcrun altool --validate-app \
            --file "$IPA_FILE" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          echo "Laddar upp Build 16 till App Store Connect..."
          xcrun altool --upload-app \
            --file "$IPA_FILE" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
