name: Build Avenyn Taxi iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera paket
        run: npm ci

      - name: Installera Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Bygg webbappen
        run: npm run build

      - name: Skapa Capacitor-konfiguration
        run: npx cap init "Avenyn Taxi" "se.avenyntaxi.app" --web-dir=out

      - name: Sätt Capacitor iOS deployment target
        run: |
          sed -i '' "s/s\.ios\.deployment_target = '[^']*'/s.ios.deployment_target = '15.0'/" node_modules/@capacitor/ios/Capacitor/Capacitor.podspec
          grep "deployment_target" node_modules/@capacitor/ios/Capacitor/Capacitor.podspec

      - name: Skapa iOS-plattform
        run: npx cap add ios

      - name: Synka Capacitor iOS
        run: npx cap sync ios

      - name: Kontrollera iOS-projekt
        run: |
          echo "Avenyn Taxi iOS"
          ls -la ios/App
          xcodebuild -version

      - name: Bygg iOS utan signering
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
