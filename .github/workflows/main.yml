name: Build Avenyn Taxi iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera paket
        run: npm ci

      - name: Installera Capacitor 7
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Bygg webbappen
        run: npm run build

      - name: Skapa Capacitor-konfiguration
        run: npx cap init "Avenyn Taxi" "se.avenyntaxi.app" --web-dir=out

      - name: Skapa iOS-plattform
        run: npx cap add ios

      - name: Synka Capacitor iOS
        run: npx cap sync ios

      - name: Kontrollera iOS-projekt
        run: |
          echo "Avenyn Taxi iOS"
          ls -la ios/App
          xcodebuild -version

      - name: Bygg iOS utan signering
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ../../build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Kontrollera byggd app
        run: |
          test -d build/Build/Products/Release-iphonesimulator/App.app
          ls -la build/Build/Products/Release-iphonesimulator/App.app

      - name: Ladda upp iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avenyn-Taxi-iOS-Simulator
          path: build/Build/Products/Release-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
