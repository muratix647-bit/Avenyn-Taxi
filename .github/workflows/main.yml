name: Build Avenyn Taxi iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installera paket
        run: npm ci

      - name: Installera Capacitor 7
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7

      - name: Bygg webbappen
        run: npm run build

      - name: Skapa Capacitor-konfiguration
        run: npx cap init "Avenyn Taxi" "se.avenyntaxi.app" --web-dir=out

      - name: Skapa iOS-plattform
        run: npx cap add ios

      - name: Synka Capacitor iOS
        run: npx cap sync ios

      - name: Kontrollera iOS-projekt
        run: |
          echo "Avenyn Taxi iOS"
          ls -la ios/App
          xcodebuild -version

      - name: Installera Apple-certifikat och provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/avenyn-taxi-distribution.p12"
          PP_PATH="$RUNNER_TEMP/avenyn-taxi.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Installerad profil: $PROFILE_NAME ($PROFILE_UUID)"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Skapa ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>YY8P86Q275</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>se.avenyntaxi.app</key>
              <string>Avenyn Taxi App Store</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Arkivera signerad iOS-app
        run: |
          mkdir -p build
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../../build/AvenynTaxi.xcarchive \
            DEVELOPMENT_TEAM=YY8P86Q275 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Avenyn Taxi App Store" \
            PRODUCT_BUNDLE_IDENTIFIER="se.avenyntaxi.app" \
            MARKETING_VERSION="1.0" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Exportera signerad IPA
        run: |
          mkdir -p build/export
          xcodebuild \
            -exportArchive \
            -archivePath build/AvenynTaxi.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "Exporterade filer:"
          find build/export -maxdepth 2 -type f -print
          test -n "$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Ladda upp signerad IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avenyn-Taxi-App-Store-IPA
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 14
