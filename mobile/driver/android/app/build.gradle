apply plugin: 'com.android.application'

def navigationProperties = new Properties()
def navigationPropertiesFile = rootProject.file('local.properties')
if (navigationPropertiesFile.exists()) {
    navigationPropertiesFile.withInputStream { navigationProperties.load(it) }
}
def navigationApiKey = System.getenv('AVENYN_NAVIGATION_API_KEY') ?: navigationProperties.getProperty('AVENYN_NAVIGATION_API_KEY', '')
def releaseKeyPath = System.getenv('AVENYN_RELEASE_KEYSTORE')
def releaseKeyAlias = System.getenv('AVENYN_RELEASE_KEY_ALIAS')
def releaseStorePassword = System.getenv('AVENYN_RELEASE_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('AVENYN_RELEASE_KEY_PASSWORD')
def releaseSigningReady = releaseKeyPath && releaseKeyAlias && releaseStorePassword && releaseKeyPassword

android {
    namespace = "se.avenyntaxi.driver"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "se.avenyntaxi.driver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.6.3"
        manifestPlaceholders = [AVENYN_NAVIGATION_API_KEY: navigationApiKey]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeyPath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.stripe:stripeterminal-taptopay:6.0.0'
    implementation 'com.stripe:stripeterminal-core:6.0.0'
    implementation 'com.google.android.libraries.navigation:navigation:7.9.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-maps'
}

tasks.register('verifyNavigationKey') {
    doLast {
        if (!navigationApiKey) throw new GradleException('Set AVENYN_NAVIGATION_API_KEY in android/local.properties before building the driver app.')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyNavigationKey' }

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
